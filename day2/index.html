<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <label for="name">Nama Lengkap</label><br>
        <input type="text" id="name" name="name"><br>

        <label for="email">Email</label><br>
        <input type="email" id="email" name="email" required><br>

        <label for="number">Nomor</label><br>
        <input type="number" id="number" name="number"><br>

        <label for="pesan">Pesan</label><br>
        <textarea name="pesan" id="pesan" cols="30" rows="10"></textarea><br>

        <label>Jenis Kelamin</label><br>
        <input type="radio" name="gender" id="male" value="laki-laki">
        <label for="male">Laki-laki</label><br>
        <input type="radio" name="gender" id="female" value="perempuan">
        <label for="female">Perempuan</label><br>

        <label>Hobi</label><br>
        <input type="checkbox" name="hobi" id="membaca" value="membaca">
        <label for="membaca">Membaca</label><br>
        <input type="checkbox" name="hobi" id="berenang" value="berenang">
        <label for="berenang">Berenang</label><br>
        <input type="checkbox" name="hobi" id="bermain-gitar" value="bermain-gitar">
        <label for="bermain-gitar">Bermain Gitar</label><br>

        <label for="negara">Negara</label><br>
        <select name="negara" id="negara">
            <option value="indonesia">Indonesia</option>
            <option value="malaysia">Malaysia</option>
            <option value="singapura">Singapura</option>
        </select><br>

        <label for="foto">Foto</label><br>
        <input type="file" name="foto" id="foto"><br>
        
        <label for="url">URL</label><br>
        <input type="url" name="url" id="url"><br>

        <input type="button" value="button"><br>
        <input type="checkbox"><br>
        <input type="color"><br>
        <input type="date"><br>
        <input type="datetime-local"><br>
        <input type="email"><br>
        <input type="file"><br>
        <input type="hidden"><br>
        <input type="image" alt="image"><br>
        <input type="month"><br>
        <input type="number"><br>
        <input type="password"><br>
        <input type="radio"><br>
        <input type="range"><br>
        <input type="reset"><br>
        <input type="search"><br>
        <input type="submit"><br>
        <input type="tel"><br>
        <input type="text"><br>
        <input type="time"><br>
        <input type="url"><br>
        <input type="week"><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
